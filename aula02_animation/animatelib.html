<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta charset="utf-8">
	<link
		rel="stylesheet"
		href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
  	/>
	<title>Biblioteca Animate</title>
</head>
<body>
	<div class="container">
		<h1 class="animate__animated animate__bounce animate__infinite">Animando minha página!</h1>
		<p class="animate__animated animate__swing animate__delay-1s">Remexendo muito!</p>
		<p class="animate__animated animate__heartBeat animate__repeat-2">Eu sou outra frase para animar!</p>
	</div>
</body>
</html>
